plugins {
    id "com.android.application"
}

android {
    namespace "org.swasthyasetu.bluetooth"
    compileSdk 35

    defaultConfig {
        applicationId "org.swasthyasetu.bluetooth"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}
